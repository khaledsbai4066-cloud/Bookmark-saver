<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>expense tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <h1 id="myh1">Expense Tracker</h1>
        <div class="balance-container">

            <div class="main-balance">
                <h3>your Balance</h3>
                <h1 id="balance">$0.00</h1>
            </div>


            <div class="summary">
                <div class="income">
                    <p>income</p>
                    <h2 id="income">$0.00</h2>
                </div>

                <div class="expense">
                    <p>expense</p>
                    <h2 id="expense">$0.00</h2>
                </div>
            </div>

        </div>
        <div class="main-content">
            <div class="transactions-content">
                <h3>Transactions</h3>
                <ul class="transactions-list"   id="transactions-list">
                </ul>
                    
            </div>


            <div class="form-container">
                <h2>Add Transaction</h2>
                <form class="transaction-form" id="transaction-form">
                    <div class="form-group">
                    <label for="description" >Description</label>
                    <input id="description" type="text" placeholder="Enter description..." required>
                    </div>

                    <div class="form-group">

                    <label for="amount">Amount</label>
                    <input id="amount"  type="number"placeholder="Enter amount..." required>
                    </div>
                    <small>Use negative(-) for expenses</small>
                <button type="submit" 
                >Add Transaction</button>
                </form>
                
            </div>
        </div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
